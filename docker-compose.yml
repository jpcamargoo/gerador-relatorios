services:
  report-api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./output:/app/output
      - ./storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build: ./web
    ports:
      - "3001:3001"
    environment:
      - API_URL=http://report-api:3000
      - PORT=3001
    depends_on:
      report-api:
        condition: service_healthy
    restart: unless-stopped
